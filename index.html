<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GROM PRO</title>
    <style>
        :root {
            --primary: #00f2ff;
            --accent: #7000ff;
            --bg: #050505;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            height: 100%; overflow: hidden;
        }

        /* ЭКРАН ВХОДА */
        #splash {
            position: fixed; inset: 0;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1000&auto=format&fit=crop');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 5000;
        }

        .letter-box { display: flex; gap: 10px; margin-bottom: 30px; }
        .g-let {
            font-size: 70px; font-weight: 900; color: var(--primary);
            text-shadow: 0 0 20px var(--primary);
            animation: drop 0.6s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; transform: translateY(-100px);
        }

        @keyframes drop { to { opacity: 1; transform: translateY(0); } }

        .morg-input {
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--accent);
            color: white; padding: 15px; border-radius: 30px;
            text-align: center; width: 250px; font-size: 20px;
            outline: none; backdrop-filter: blur(10px);
            margin-bottom: 15px;
        }

        /* КНОПКА ВОЙТИ */
        .login-btn {
            background: var(--primary);
            color: #000; border: none;
            padding: 12px 40px; border-radius: 25px;
            font-weight: 900; font-size: 16px;
            cursor: pointer; box-shadow: 0 0 15px var(--primary);
            text-transform: uppercase; transition: 0.3s;
        }
        .login-btn:active { transform: scale(0.95); box-shadow: 0 0 5px var(--primary); }

        /* ИНТЕРФЕЙС (СКРЫТ) */
        #app { display: none; height: 100%; flex-direction: column; }
        
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222; }
        .radio-logo { width: 50px; height: 50px; border-radius: 50%; background: var(--primary); color: #000; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; box-shadow: 0 0 15px var(--primary); }
        .radio-logo.playing { animation: pulse 1s infinite; background: #ff0037; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .card { background: #181818; border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #222; }
        .star-logo { width: 40px; height: 40px; background: url('https://cdn-icons-png.flaticon.com/512/1828/1828884.png'); background-size: contain; filter: invert(1); animation: spin 4s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ЧАТ */
        #chat-view { display: none; }
        .chat-flow { height: 60vh; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #222; padding: 10px 15px; border-radius: 15px; align-self: flex-start; position: relative; }
        .msg.me { align-self: flex-end; background: var(--accent); }
        .del { position: absolute; top: -5px; right: -5px; color: red; font-weight: bold; cursor: pointer; }

        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #111; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: #555; font-size: 11px; text-align: center; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div id="splash">
        <div class="letter-box">
            <span class="g-let" style="animation-delay: 0.1s">G</span>
            <span class="g-let" style="animation-delay: 0.2s">R</span>
            <span class="g-let" style="animation-delay: 0.3s">O</span>
            <span class="g-let" style="animation-delay: 0.4s">M</span>
        </div>
        <input type="password" id="passInput" class="morg-input" placeholder="ACCESS CODE">
        <button class="login-btn" onclick="checkAuth()">ENTER</button>
        <p id="err" style="color: red; display: none; margin-top: 10px;">WRONG CODE</p>
    </div>

    <div id="app">
        <header>
            <div>
                <div style="font-weight: 900; font-size: 20px;">GROM <span style="color:var(--accent)">PRO</span></div>
                <div id="uID" style="font-size: 10px; color: var(--primary); font-family: monospace;"></div>
            </div>
            <div class="radio-logo" id="rBtn" onclick="toggleRadio()">G</div>
        </header>

        <main id="home" class="content">
            <div class="card">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div class="star-logo"></div>
                    <div style="flex:1">
                        <small>ЭНЕРГИЯ TITAN</small>
                        <div style="height:4px; background:#333; margin:5px 0;"><div style="width:92%; height:100%; background:var(--primary);"></div></div>
                    </div>
                </div>
            </div>
            <div class="card">
                <h4>Техника G-тяги</h4>
                <p style="font-size: 13px; color: #ccc;">Секреты мощного рывка.</p>
            </div>
        </main>

        <main id="chat-view" class="content">
            <div id="chatBox" class="chat-flow"></div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="msgIn" placeholder="Type..." style="flex:1; background:#222; border:none; padding:15px; color:white; border-radius:10px;">
                <button onclick="send()" style="background:var(--primary); border:none; border-radius:10px; padding:0 20px;">OK</button>
            </div>
        </main>

        <nav>
            <div class="nav-item active" onclick="showPage('home', this)">🏠<br>HOME</div>
            <div class="nav-item" onclick="showPage('chat-view', this)">💬<br>CHAT</div>
        </nav>
    </div>

    <audio id="radio" src="https://ep256.hostingradio.ru:8052/europaplus256.mp3"></audio>

    <script>
        const KEY = "MORG";
        const myID = "GR-" + Math.floor(Math.random() * 9999);
        document.getElementById('uID').innerText = "ID: " + myID;

        function checkAuth() {
            const val = document.getElementById('passInput').value.toUpperCase();
            if (val === KEY) {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
            } else {
                document.getElementById('err').style.display = 'block';
            }
        }

        // Авто-проверка при вводе
        document.getElementById('passInput').addEventListener('input', (e) => {
            if (e.target.value.toUpperCase() === KEY) checkAuth();
        });

        function showPage(id, el) {
            document.querySelectorAll('.content').forEach(p => p.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            el.classList.add('active');
        }

        let isPlaying = false;
        const audio = document.getElementById('radio');
        function toggleRadio() {
            if (!isPlaying) { audio.play(); document.getElementById('rBtn').classList.add('playing'); }
            else { audio.pause(); document.getElementById('rBtn').classList.remove('playing'); }
            isPlaying = !isPlaying;
        }

        function send() {
            const input = document.getElementById('msgIn');
            const box = document.getElementById('chatBox');
            if (input.value.trim()) {
                const div = document.createElement('div');
                div.className = 'msg me';
                div.innerHTML = `<span class="del" onclick="this.parentElement.remove()">×</span>
                                 <small>${myID}</small><br>${input.value}`;
                box.appendChild(div);
                input.value = '';
                box.scrollTop = box.scrollHeight;
            }
        }
    </script>
</body>
</html>
