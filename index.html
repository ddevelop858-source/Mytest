<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS Radio - Final Monolith</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at center, #0a0a2a 0%, #000000 100%);
            color: white; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        h1 { margin-top: 15px; font-size: 10px; letter-spacing: 5px; text-shadow: 0 0 10px #ff0066; opacity: 0.6; text-transform: uppercase; }

        .deck { display: flex; gap: 40px; margin-top: 50px; z-index: 10; }
        
        /* Пластинки */
        .logo {
            width: 100px; height: 100px; border-radius: 50%;
            border: 2px solid #ff0066; 
            cursor: pointer; box-shadow: 0 0 15px rgba(255, 0, 102, 0.4);
            position: relative;
            display: flex; align-items: center; justify-content: center;
            background-position: center;
            background-size: cover;
            transform-origin: center center;
            transition: transform 0.5s ease;
        }

        #record-left {
            background-image: repeating-radial-gradient(circle, #111 0%, #111 2%, #222 3%, #222 5%);
        }

        /* ТВОЯ КАРТИНКА ИЗ GOOGLE DRIVE */
        #record-right {
            background-image: url('https://lh3.googleusercontent.com/d/1OYZg5hJ8fqSBG7rlQja44PcDF5uBbnCN');
            background-color: #111;
        }

        /* АНИМАЦИЯ ВРАЩЕНИЯ */
        .spinning {
            animation: rotate_disc 4s linear infinite !important;
        }

        @keyframes rotate_disc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .label { 
            font-size: 10px; font-weight: bold; text-shadow: 0 0 5px #000; 
            color: #fff; z-index: 5; pointer-events: none;
            background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px;
            position: absolute;
        }

        /* УЗКИЕ LED-ДОРОЖКИ ПО БОКАМ */
        .vu-side {
            position: fixed; bottom: 40px; width: 10px; height: 380px;
            background: rgba(0, 0, 0, 0.3); display: flex; flex-direction: column-reverse;
            padding: 2px; gap: 2px;
        }
        #vu-left { left: 12px; }
        #vu-right { right: 12px; }
        .vu-dot { width: 100%; height: 6px; background: #1a1a1a; border-radius: 1px; transition: 0.04s; }
        
        .vu-dot.active.green { background: #00ff88; box-shadow: 0 0 5px #00ff88; }
        .vu-dot.active.yellow { background: #ffcc00; box-shadow: 0 0 5px #ffcc00; }
        .vu-dot.active.red { background: #ff0044; box-shadow: 0 0 8px #ff0044; }

        /* ЧАТ */
        #chatBtn { position: fixed; bottom: 25px; padding: 12px 40px; background: #0066ff; border: none; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; }
        #chatWindow { position: fixed; bottom: 0; width: 100%; max-width: 450px; height: 70vh; background: rgba(5, 5, 15, 0.98); display: none; flex-direction: column; border-radius: 20px 20px 0 0; border: 1px solid #333; z-index: 100; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; font-size: 14px; }
        
        .input-group { display: flex; padding: 15px; gap: 10px; background: #000; align-items: center; border-top: 1px solid #222; }
        #uMsg { background: #111; border: 1px solid #444; color: white; padding: 10px 15px; border-radius: 20px; flex: 1; outline: none; }
        .send-btn { background: #ff0066; border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
</head>
<body>

<h1>🎧 SS RADIO | STEREO CONNECTED</h1>

<div class="deck">
    <div id="record-left" class="logo"><div class="label">PLAY</div></div>
    <div id="record-right" class="logo"><div class="label">STS</div></div>
</div>

<div class="vu-side" id="vu-left"></div>
<div class="vu-side" id="vu-right"></div>

<button id="chatBtn">ОТКРЫТЬ ЧАТ</button>

<audio id="radio" crossorigin="anonymous">
    <source src="https://ep256.hostingradio.ru:8052/europaplus256.mp3" type="audio/mpeg">
</audio>

<div id="chatWindow">
    <div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #222;">
        <span id="userNameTag" style="color:#00ccff; font-weight:bold; font-size:11px;">ЗАГРУЗКА...</span>
        <button onclick="document.getElementById('chatWindow').style.display='none'" style="background:none; border:none; color:#ff0066; cursor:pointer; font-size:24px;">&times;</button>
    </div>
    <div id="messages"></div>
    <div class="input-group">
        <input id="uMsg" placeholder="Сообщение..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">➔</button>
    </div>
</div>

<script>
// --- FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyCWoZbN4Ot724s-G1EbkylA0AqqWQiGt5o",
    databaseURL: "https://radiochatss-default-rtdb.firebaseio.com",
    projectId: "radiochatss"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let myName = localStorage.getItem('ss_user_name') || 'DJ-' + Math.floor(Math.random() * 8999 + 1000);
localStorage.setItem('ss_user_name', myName);
document.getElementById('userNameTag').textContent = "НИК: " + myName;

const msgBox = document.getElementById('messages');
db.ref('chat').limitToLast(50).on('child_added', snap => {
    const d = snap.val();
    const div = document.createElement('div');
    div.style.marginBottom = "10px";
    div.innerHTML = `<b style="color:#ff0066">${d.user}:</b> ${d.text}`;
    msgBox.appendChild(div);
    msgBox.scrollTop = msgBox.scrollHeight;
});

function sendMessage() {
    const inp = document.getElementById('uMsg');
    if(inp.value.trim()){
        db.ref('chat').push({ user: myName, text: inp.value });
        inp.value = "";
    }
}

document.getElementById('chatBtn').onclick = () => document.getElementById('chatWindow').style.display = 'flex';

// --- LED ДОРОЖКИ ---
const totalDots = 35;
function buildVU(id) {
    const el = document.getElementById(id);
    for(let i=0; i<totalDots; i++) {
        const dot = document.createElement('div');
        dot.className = 'vu-dot';
        if(i < 20) dot.classList.add('green');
        else if(i < 28) dot.classList.add('yellow');
        else dot.classList.add('red');
        el.appendChild(dot);
    }
}
buildVU('vu-left'); buildVU('vu-right');

const radio = document.getElementById('radio');
const recL = document.getElementById('record-left');
const recR = document.getElementById('record-right');
let audioCtx, analyser, dataArr;

// --- УПРАВЛЕНИЕ ---
recL.onclick = () => {
    if (radio.paused) {
        radio.play().then(() => {
            recL.classList.add('spinning');
            recR.classList.add('spinning');
            if (!audioCtx) initAudio();
        });
    } else {
        radio.pause();
        recL.classList.remove('spinning');
        recR.classList.remove('spinning');
    }
};

function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    const src = audioCtx.createMediaElementSource(radio);
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    analyser.fftSize = 64;
    dataArr = new Uint8Array(analyser.frequencyBinCount);
    render();
}

function render() {
    requestAnimationFrame(render);
    if(!analyser) return;
    analyser.getByteFrequencyData(dataArr);
    updateDots('vu-left', dataArr[3]);
    updateDots('vu-right', dataArr[4]);
}

function updateDots(id, volume) {
    let activeCount = Math.round((volume / 220) * totalDots);
    const dots = document.getElementById(id).querySelectorAll('.vu-dot');
    dots.forEach((d, i) => {
        if(i < activeCount) d.classList.add('active');
        else d.classList.remove('active');
    });
}
</script>
</body>
</html>
