<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROM - Sport & Stream</title>
    <style>
        :root {
            --primary: #00f2ff;
            --accent: #7000ff;
            --bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: white;
            overflow-x: hidden;
        }

        /* Шапка */
        header {
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, #111, transparent);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--primary);
            text-shadow: 0 0 15px var(--primary);
        }

        /* Правый блок управления */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }

        .btn-stream {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .btn-europe {
            background: #ff0037;
            color: white;
            font-size: 10px;
            text-transform: uppercase;
            border: 2px solid white;
        }

        .btn-g {
            background: var(--primary);
            color: #000;
            font-size: 24px;
            position: relative;
        }

        .btn-g::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--primary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Контент */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 120px);
        }

        .sport-content {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .hero-title {
            font-size: 4rem;
            margin: 0;
            line-height: 1;
        }

        .hero-title span {
            color: var(--accent);
        }

        /* Чат */
        .chat-section {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--accent);
            overflow: hidden;
        }

        .chat-header {
            padding: 15px;
            background: var(--accent);
            font-weight: bold;
            text-align: center;
        }

        .messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.9rem;
        }

        .msg {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
        }

        .msg b { color: var(--primary); }

        .chat-input {
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            background: #222;
            border: none;
            padding: 10px;
            color: white;
            border-radius: 5px;
        }

        /* "От себя" — Энерго-виджет */
        .energy-bar {
            margin-top: 30px;
            width: 300px;
        }
        .bar-bg {
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }
        .bar-fill {
            width: 75%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            box-shadow: 0 0 10px var(--primary);
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">GROM</div>
    </header>

    <div class="controls">
        <button class="btn-stream btn-europe">Европа<br>Плюс</button>
        <button class="btn-stream btn-g">G</button>
    </div>

    <main class="main-container">
        <div class="sport-content">
            <h1 class="hero-title">ПРЕДЕЛЫ<br><span>ТОЛЬКО В ГОЛОВЕ</span></h1>
            <p>Персональная платформа для мониторинга тренировок и стриминга активностей.</p>
            
            <div class="energy-bar">
                <span>УРОВЕНЬ ДРАЙВА</span>
                <div class="bar-bg">
                    <div class="bar-fill"></div>
                </div>
            </div>
        </div>

        <aside class="chat-section">
            <div class="chat-header">LIVE CHAT</div>
            <div class="messages" id="chatBox">
                <div class="msg"><b>Admin:</b> Добро пожаловать на GROM!</div>
                <div class="msg"><b>User122:</b> Какая сегодня тренировка?</div>
                <div class="msg"><b>Grom_Fan:</b> Ждем прямой эфир в 18:00!</div>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Сообщение...">
                <button style="background: var(--primary); border:none; border-radius:5px; padding:0 15px; cursor:pointer;">></button>
            </div>
        </aside>
    </main>

    <script>
        // Простая имитация добавления сообщений
        const input = document.querySelector('input');
        const btn = document.querySelector('.chat-input button');
        const chatBox = document.getElementById('chatBox');

        btn.onclick = () => {
            if(input.value) {
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `<b>Вы:</b> ${input.value}`;
                chatBox.appendChild(div);
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };
    </script>
</body>
</html>
